{% extends "base.html" %}

{% block content %}

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="col-md-6 bg-white p-5 rounded-4 shadow-sm">

        <h2 class="fw-bold mb-4 text-center">Daily Check-In</h2>
        <p class="text-muted text-center mb-4">
            Tell us how you're feeling today
        </p>

        <form action="{{ url_for('recommendations') }}" method="POST">

            <!-- Mood -->
            <div class="mb-3">
                <label class="form-label">How are you feeling today?</label>
                <select name="mood" class="form-select" required>
                    <option value="">Select</option>
                    <option value="happy">😊 Happy</option>
                    <option value="okay">🙂 Okay</option>
                    <option value="anxious">😰 Anxious</option>
                    <option value="low">😔 Low</option>
                    <option value="overwhelmed">😩 Overwhelmed</option>
                    <option value="exhausted">😴 Exhausted</option>
                </select>
            </div>

            <!-- Academic Stress -->
            <div class="mb-3">
                <label class="form-label">Academic Stress</label>
                <select name="academic" class="form-select" required>
                    <option value="">Select</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <!-- Workload -->
            <div class="mb-3">
                <label class="form-label">Workload</label>
                <select name="workload" class="form-select" required>
                    <option value="">Select</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <!-- Physical Activity -->
            <div class="mb-3">
                <label class="form-label">Physical Activity</label>
                <select name="activity" class="form-select" required>
                    <option value="">Select</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <!-- Rating -->
            <div class="mb-4">
                <label class="form-label">Overall Wellbeing (1–10)</label>
                <input type="number" name="rating" min="1" max="10" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 rounded-pill">
                Get Recommendation
            </button>

        </form>

    </div>

</div>

{% endblock %}
