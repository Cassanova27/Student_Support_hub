<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Support Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #fce4ec 50%, #e8f5e9 100%);
            min-height: 100vh;
        }

        .navbar {
            background: white !important;
            border-bottom: 1px solid #E9D8FD;
            padding: 12px 24px;
        }

        .navbar-brand {
            font-weight: 700;
            color: #5B21B6 !important;
            font-size: 18px;
        }

        .nav-link {
            color: #555 !important;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px !important;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: #EDE9FE;
            color: #5B21B6 !important;
        }

        .nav-link.active {
            background: #D6C9F0;
            color: #5B21B6 !important;
        }

        .nav-logout {
            background: #2a2a2a;
            color: white !important;
            border-radius: 20px;
            padding: 6px 16px !important;
        }

        .nav-logout:hover {
            background: #444 !important;
            color: white !important;
        }
    </style>
</head>

<body>

    {% if session.get('user_id') %}
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">

            <a class="navbar-brand" href="/dashboard">✦ Student Support</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">🏠 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/checkin">📋 Check-in</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/view-checkins">📈 History</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/resources">📚 Resources</a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="nav-link nav-logout" href="/logout">Log out</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
    {% endif %}

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
